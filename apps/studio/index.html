<!doctype html>
<html lang="en" data-theme="photofinish">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eceff2" />
    <title>StatReel · Studio</title>
    <meta name="description" content="StatReel turns licensed sports data into 30-90 s data-viz videos of stats evolving over time. Every video carries its licence lineage." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Photo Finish is the only theme (ADR 009; same rule as src/theme.ts): drop any stale stored
         theme pick before first paint. Storage may throw: guarded. */
      (function () {
        try {
          var k = "statreel.theme";
          var v = window.localStorage.getItem(k);
          if (v !== null && v !== "photofinish") window.localStorage.removeItem(k);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
