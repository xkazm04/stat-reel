# Source registry - the single source of truth for what may be fetched and how (DESIGN.md §5.1).
# Ingestion refuses any host not listed under a source's `hosts`. `verdict: avoid` sources carry no
# hosts and are unreachable in code. Seeded from DESIGN.md Appendix A (research 2026-09-29).
#
# rate_limit: the PUBLISHED limit ({requests, per_s}); clients run at <= 50 % of it. null = none
# published -> default 1 request / 3 s per host.

- id: f1db
  sport: F1
  url: https://github.com/f1db/f1db
  # github.com/robots.txt disallows /*/download for generic agents, so release assets are fetched
  # through the GitHub REST API (ADR 001), which redirects to release-assets.githubusercontent.com.
  access: api
  hosts: [api.github.com, release-assets.githubusercontent.com]
  verdict: legal
  license: CC-BY-4.0
  attribution: "Data: F1DB (CC BY 4.0)"
  kinds: [hist, bio, live]
  coverage: {from: 1950, to: current}
  rate_limit: {requests: 60, per_s: 3600, note: "GitHub REST, unauthenticated"}
  terms_url: https://github.com/f1db/f1db/blob/main/LICENSE
  terms_checked_at: 2026-09-29
  notes: "Released after every race; no telemetry."

