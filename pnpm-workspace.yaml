packages:
  - apps/*
  - packages/*
allowBuilds:
  better-sqlite3: true
  esbuild: true
  "@napi-rs/keyring": true
# Windows on ARM: Remotion ships no win32-arm64 compositor, so the render worker runs under an
# x64 Node (emulated). Install both architectures' optional binaries (ADR 004).
supportedArchitectures:
  os: [current]
  cpu: [current, x64]
