version: 2

# The ONLY schema the MCP `query` tool may read. Every column is documented: the comments are
# persisted into DuckDB and served to the LLM by `describe_views`.
models:
  - name: f1_driver_era_adjusted
    description: >-
      F1 driver careers, raw vs era-adjusted. Adjusted = every Grand Prix re-scored under the current
      points system (25-18-15-12-10-8-6-4-2-1) divided by starts; Indianapolis 500 excluded; shared cars
      split. An ESTIMATE of dominance, not an official statistic - say "era-adjusted" when quoting it.
      Source F1DB (CC BY 4.0), attribution required.
    columns:
      - {name: fact_key, description: "Stable id of this fact; cite it in props and narration.", data_tests: [unique, not_null]}
      - {name: player_id, description: "f1db driver id (slug)."}
      - {name: display_name, description: "Name as commonly used (use this on screen and in narration)."}
      - {name: full_name, description: "Full legal name of the driver."}
      - {name: first_season, description: "First season with a Grand Prix start (Indianapolis excluded)."}
      - {name: last_season, description: "Latest season with a start."}
      - {name: seasons, description: "Number of seasons with at least one start."}
      - {name: starts, description: "Grand Prix starts, excluding non-starts (DNQ/DNPQ/DNS/DNP) and the Indianapolis 500."}
      - {name: wins, description: "Wins among those starts (shared wins count for each driver)."}
      - {name: podiums, description: "Top-3 finishes among those starts."}
      - {name: titles, description: "World Drivers' Championships won (leading a season still in progress is not a title)."}
      - {name: points_awarded, description: "Career Grand Prix points as historically awarded (all rounds, era rules; Sprint points from 2021 on are NOT included, so this is below the official career total for Sprint-era drivers). RAW metric."}
      - {name: points_current_system, description: "Career points re-scored under the current system (no fastest-lap point, no sprints)."}
      - {name: points_per_start_current_system, description: "ADJUSTED metric - points_current_system / starts (0-25)."}
      - {name: win_rate, description: "wins / starts (0-1)."}
      - {name: peak_season_share, description: "Best season's current-system points as a share of the maximum possible (25 x races), in seasons where the driver started at least half the races."}
      - {name: eligible, description: "True when starts >= min_starts; only eligible drivers are ranked."}
      - {name: rank_raw, description: "Rank by points_awarded (Grand Prix points, Sprints excluded) among eligible drivers (1 = most)."}
      - {name: rank_adjusted, description: "Rank by points_per_start_current_system among eligible drivers."}
      - {name: min_starts, description: "Eligibility threshold used for the ranks."}
      - {name: method, description: "Plain-language statement of the adjustment; show it on screen or in the description."}
      - {name: attribution, description: "Attribution string that must accompany any use."}
  - name: f1_driver_seasons
    description: >-
      F1 driver seasons with raw and current-system points and share of the season maximum.
      Source F1DB (CC BY 4.0), attribution required.
    columns:
      - {name: fact_key, description: "Stable id of this fact; cite it in props and narration.", data_tests: [unique, not_null]}
      - {name: player_id, description: "f1db driver id (slug)."}
      - {name: display_name, description: "Name as commonly used (use this on screen and in narration)."}
      - {name: full_name, description: "Full legal name of the driver."}
      - {name: season, description: "Championship year."}
      - {name: starts, description: "Starts that season (Indianapolis excluded)."}
      - {name: wins, description: "Wins that season."}
      - {name: podiums, description: "Podiums that season."}
      - {name: points_awarded, description: "Grand Prix points as awarded that season under its own rules (Indianapolis 500 included, Sprints NOT included - see sprint_points)."}
      - {name: sprint_points, description: "Sprint points awarded that season (Sprints exist 2021 onwards; 0 before). points_awarded + sprint_points is the season's championship points (before 1991 the official total counted only a best-N subset)."}
      - {name: points_current_system, description: "Points re-scored under the current system."}
      - {name: season_share, description: "points_current_system / (25 x races held that season, Indianapolis excluded)."}
      - {name: season_races, description: "Races held that season (Indianapolis excluded)."}
      - {name: championship_position, description: "Drivers' Championship position at season end; for the season still in progress (f1_data_as_of.latest_season) the CURRENT position, not a final one. Null if unclassified."}
      - {name: attribution, description: "Attribution string that must accompany any use."}
  - name: f1_race_results
    description: >-
      Every Grand Prix entry, race by race (1950 onwards): the time series for time-evolution videos
      (wins races, points fights, record handovers). Source F1DB (CC BY 4.0), attribution required.
    columns:
      - {name: fact_key, description: "Stable id of this fact; cite it as <fact_key>#<column>.", data_tests: [unique, not_null]}
      - {name: race_id, description: "f1db race id."}
      - {name: season, description: "Championship year."}
      - {name: round, description: "Round number within the season."}
      - {name: race_date, description: "Race date."}
      - {name: grand_prix_id, description: "Grand Prix slug (e.g. monaco); indianapolis for the Indy 500 rounds 1950-1960."}
      - {name: race_name, description: "Official race name."}
      - {name: is_indianapolis, description: "True for Indianapolis 500 rounds (separate field; excluded from per-start metrics)."}
      - {name: player_id, description: "f1db driver id (slug)."}
      - {name: display_name, description: "Driver name as commonly used."}
      - {name: team_id, description: "f1db constructor id."}
      - {name: team_name, description: "Constructor name."}
      - {name: entry_order, description: "Order of this entry in the race classification (a driver who took over a team-mate's car has two entries)."}
      - {name: grid_position, description: "Starting grid position (null when not recorded)."}
      - {name: position_number, description: "Classified finishing position (null if not classified)."}
      - {name: position_text, description: "Result text (number, DNF, DNQ, DNS, DSQ, NC, EX, DNP, DNPQ)."}
      - {name: started, description: "True if the driver took the start."}
      - {name: shared_car, description: "True when the car was shared (1950s); points split."}
      - {name: points_awarded, description: "Points awarded under that season's rules."}
      - {name: points_current_system, description: "Points under the current system (25-18-15-12-10-8-6-4-2-1)."}
      - {name: attribution, description: "Attribution string that must accompany any use."}
  - name: f1_constructor_seasons
    description: >-
      Constructor (team) per season: starts, wins, podium finishes, points. For team-dynasty timelines.
      Source F1DB (CC BY 4.0), attribution required.
    columns:
      - {name: fact_key, description: "Stable id of this fact; cite it as <fact_key>#<column>.", data_tests: [unique, not_null]}
      - {name: team_id, description: "f1db constructor id."}
      - {name: team_name, description: "Constructor name."}
      - {name: season, description: "Championship year."}
      - {name: races_started, description: "Races in which the team had at least one starter (Indianapolis excluded)."}
      - {name: wins, description: "Race wins that season (Indianapolis excluded)."}
      - {name: podium_finishes, description: "Top-3 finishes by the team's cars (one race can count twice)."}
      - {name: points_awarded, description: "Drivers' Grand Prix points scored in the team's cars, as awarded (Indianapolis 500 included; Sprint points not included)."}
      - {name: attribution, description: "Attribution string that must accompany any use."}
  - name: f1_driver_bios
    description: Driver biographical facts (date of birth, nationality) for age-based timelines. Source F1DB (CC BY 4.0).
    columns:
      - {name: fact_key, description: "Stable id of this fact; cite it as <fact_key>#<column>.", data_tests: [unique, not_null]}
      - {name: player_id, description: "f1db driver id (slug)."}
      - {name: display_name, description: "Driver name as commonly used."}
      - {name: full_name, description: "Full legal name."}
      - {name: date_of_birth, description: "Date of birth (null if unknown)."}
      - {name: nationality, description: "Nationality country id."}
      - {name: attribution, description: "Attribution string that must accompany any use."}
  - name: f1_seasons
    description: Seasons with the number of races held. Source F1DB (CC BY 4.0).
    columns:
      - {name: fact_key, description: "Stable id of this fact; cite it as <fact_key>#<column>.", data_tests: [unique, not_null]}
      - {name: season, description: "Championship year."}
      - {name: races_held, description: "Races held with results."}
      - {name: races_held_excl_indianapolis, description: "Races held, Indianapolis 500 excluded."}
      - {name: races_scheduled, description: "Races on the calendar (future rounds included for the current season)."}
      - {name: attribution, description: "Attribution string that must accompany any use."}
  - name: f1_driver_race_cumulative
    description: >-
      Dense race-by-race cumulative career totals per driver: one row per (driver, race) from the driver's
      first Grand Prix start to the LATEST race in the data, totals carried forward on races the driver did
      not enter (no gaps, so a bar-chart race can step through race_seq directly). Grand Prix only - the
      Indianapolis 500 is not a row and counts for nothing. Retired drivers stay in the series with frozen
      totals. Shared-car and take-over wins count once per driver per race. Points are the CURRENT system
      (25-18-15-12-10-8-6-4-2-1, no fastest-lap point, no sprints, shared cars split), not as historically
      awarded. Source F1DB (CC BY 4.0), attribution required.
    columns:
      - {name: fact_key, description: "Stable id of this driver-at-race fact; cite it as <fact_key>#<column>.", data_tests: [unique, not_null]}
      - {name: player_id, description: "f1db driver id (slug)."}
      - {name: display_name, description: "Name as commonly used (use this on screen)."}
      - {name: full_name, description: "Full legal name of the driver."}
      - {name: race_id, description: "f1db race id."}
      - {name: season, description: "Championship year of the race."}
      - {name: round, description: "Round number within the season."}
      - {name: race_date, description: "Race date; the data clock for time-evolution videos."}
      - {name: race_seq, description: "1-based position of the race in the all-time Grand Prix sequence (Indianapolis excluded); consecutive, so it is the dense x-axis."}
      - {name: entered, description: "True if the driver took the start in this race; false on carried-forward rows."}
      - {name: starts_cum, description: "Grand Prix starts up to and including this race."}
      - {name: wins_cum, description: "Race wins up to and including this race (a shared or taken-over winning car counts once for each driver)."}
      - {name: podiums_cum, description: "Top-3 finishes up to and including this race."}
      - {name: points_cum, description: "Career points up to and including this race under the CURRENT points system (estimate, not as awarded)."}
      - {name: rank_wins_cum, description: "Rank among all drivers at this race by wins_cum, unique and stable: ties broken by podiums_cum, then points_cum, then driver id. 1 = most wins."}
      - {name: tied, description: "True when another driver has the same wins_cum at this race; the rank order within the tie is then a tie-break, not a real difference in wins."}
      - {name: attribution, description: "Attribution string that must accompany any use."}
  - name: f1_season_standings_by_round
    description: >-
      The Drivers' Championship after every round of every season (1950 onwards): one row per (season, round,
      driver) for every driver who started a Grand Prix or scored in that season, at EVERY round of the season
      (0 points before their first race, totals carried forward). OFFICIAL points: as awarded under that season's
      own scoring, Grand Prix plus Sprint (Sprints exist 2021 onwards), and the Indianapolis 500 rounds of
      1950-1960 DO count here because they counted for the championship (unlike the career views, which
      exclude them). Tie-break: points, then wins, then second places, then thirds ... (Grand Prix results, down
      to 8th), then driver id; the regulations' final "earliest achieved" step is not implemented. Seasons before
      1991 counted only each driver's best N results: there points_cum is the TOTAL as awarded and can exceed
      the official championship points, so ranks can differ from the official table (drops_apply = true); from
      1991 on, points_cum after the final round equals the official championship points. Source F1DB (CC BY 4.0),
      attribution required.
    columns:
      - {name: fact_key, description: "Stable id of this driver-standing-at-round fact; cite it as <fact_key>#<column>.", data_tests: [unique, not_null]}
      - {name: season, description: "Championship year."}
      - {name: round, description: "Round number within the season (the data clock for a season video)."}
      - {name: race_id, description: "f1db race id of the round."}
      - {name: race_date, description: "Race date of the round."}
      - {name: player_id, description: "f1db driver id (slug)."}
      - {name: display_name, description: "Name as commonly used (use this on screen)."}
      - {name: full_name, description: "Full legal name of the driver."}
      - {name: points_round, description: "Championship points scored in this round: Grand Prix plus Sprint, as awarded that season (0 if none)."}
      - {name: sprint_points_round, description: "The Sprint part of points_round (0 when the round had no Sprint or the driver scored none)."}
      - {name: points_cum, description: "Championship points up to and including this round, as awarded that season (Sprints included). Before 1991 this is the all-results total, not the best-N official figure."}
      - {name: wins_cum, description: "Grand Prix wins in the season up to and including this round (Indianapolis 500 included; Sprint wins are not counted)."}
      - {name: seconds_cum, description: "Second places in the season so far (Grand Prix results), the first tie-break after wins."}
      - {name: thirds_cum, description: "Third places in the season so far (Grand Prix results), the second tie-break after wins."}
      - {name: rank, description: "Championship position after this round: unique within (season, round), by points_cum then the wins/seconds/thirds... tie-break. 1 = leader."}
      - {name: gap_to_leader, description: "Points behind the leader after this round (0 for the leader)."}
      - {name: tied_on_points, description: "True when another driver has the same points_cum at this round; rank is then decided by the tie-break."}
      - {name: is_final_round, description: "True on the last round with results of the season (for the current season: the latest race so far)."}
      - {name: drops_apply, description: "True for seasons before 1991, when only a best-N subset of results counted: points_cum may then exceed the official total."}
      - {name: attribution, description: "Attribution string that must accompany any use."}
  - name: f1_race_winners
    description: >-
      One row per (race, winning driver) of every Grand Prix since 1950 (Indianapolis 500 rounds excluded): who
      won, for which team, how old they were and where they started. A car shared between drivers (1950s) gives one
      row per driver who classified first in it (shared_drive = true), so a race can have more than one row.
      Source F1DB (CC BY 4.0), attribution required.
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: [race_id, player_id]
    columns:
      - {name: fact_key, description: "Stable id of this race-win fact; cite it as <fact_key>#<column>.", data_tests: [unique, not_null]}
      - {name: race_id, description: "f1db race id."}
      - {name: season, description: "Championship year."}
      - {name: round, description: "Round number within the season."}
      - {name: race_date, description: "Race date; the data clock for time-evolution videos."}
      - {name: grand_prix_id, description: "Grand Prix slug (e.g. monaco)."}
      - {name: race_name, description: "Official race name."}
      - {name: player_id, description: "f1db driver id of the winner (slug)."}
      - {name: display_name, description: "Winner's name as commonly used (use this on screen)."}
      - {name: full_name, description: "Winner's full legal name."}
      - {name: team_id, description: "f1db constructor id of the winning car."}
      - {name: team_name, description: "Constructor name of the winning car."}
      - {name: date_of_birth, description: "Winner's date of birth (from the f1db driver record)."}
      - {name: age_at_win, description: "Winner's exact age on race day in years (decimal: days since birth / 365.2425)."}
      - {name: grid_position, description: "Winner's starting grid position; NULL when f1db has no grid for that entry (common in early seasons and for pit-lane starts) - never assume pole."}
      - {name: shared_drive, description: "True when the winning car was shared between drivers (1950s); the win is credited to each of them."}
      - {name: attribution, description: "Attribution string that must accompany any use."}
  - name: f1_data_as_of
    description: >-
      One row: how fresh the data behind every other llm view is. Say "data as of round N of <season>" (the latest
      race WITH results), never imply live data. Also carries the F1DB release the warehouse was built from.
      Source F1DB (CC BY 4.0), attribution required.
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: [fact_key]
    columns:
      - {name: fact_key, description: "Stable id of this fact (always f1db:data-as-of); cite it as <fact_key>#<column>.", data_tests: [unique, not_null]}
      - {name: latest_race_date, description: "Date of the latest race with results: the data is as of this day."}
      - {name: latest_season, description: "Championship year of that latest race."}
      - {name: latest_round, description: "Round number of that latest race within its season (the N in 'data as of round N')."}
      - {name: latest_race_id, description: "f1db race id of the latest race with results."}
      - {name: latest_race_name, description: "Official name of the latest race with results."}
      - {name: latest_season_races_held, description: "Races with results so far in that season."}
      - {name: latest_season_races_scheduled, description: "Races on that season's calendar (future rounds included)."}
      - {name: release_tag, description: "F1DB release the data was built from (e.g. v2026.15.1)."}
      - {name: release_published_date, description: "Date F1DB published that release (null if the release did not report one)."}
      - {name: snapshot_fetched_at, description: "UTC timestamp when this snapshot was fetched from F1DB."}
      - {name: attribution, description: "Attribution string that must accompany any use."}
