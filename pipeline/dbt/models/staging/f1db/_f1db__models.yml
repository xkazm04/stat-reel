version: 2

models:
  - name: stg_f1db__drivers
    columns:
      - name: driver_id
        data_tests: [unique, not_null]
  - name: stg_f1db__races
    columns:
      - name: race_id
        data_tests: [unique, not_null]
  - name: stg_f1db__race_results
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_f1db__races'), field: race_id}
      - name: driver_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_f1db__drivers'), field: driver_id}
  - name: stg_f1db__constructors
    columns:
      - name: constructor_id
        data_tests: [unique, not_null]
  - name: stg_f1db__season_driver_standings
    data_tests:
      - dbt_utils_free_unique_combination:
          columns: [season, driver_id]
    columns:
      - name: driver_id
        data_tests: [not_null]
  - name: stg_f1db__sprint_race_results
    columns:
      - name: race_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_f1db__races'), field: race_id}
      - name: driver_id
        data_tests:
          - not_null
          - relationships: {to: ref('stg_f1db__drivers'), field: driver_id}
