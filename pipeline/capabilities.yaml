# Capability tests per sport x kind x source (DESIGN.md §5.4). Evaluated by
# statreel_ingest.capabilities after every transform; results -> meta.capabilities -> heatmap.
# A new sport/source adds rows here; no code changes.

- sport: F1
  kind: hist
  source_id: f1db
  relation: core.player_season_stats
  season_column: season
  checks:
    min_rows: 3000
    coverage_from_max: 1950
    min_seasons: 70
    max_null_ratio: {points_current_system: 0.0, starts: 0.0}

- sport: F1
  kind: bio
  source_id: f1db
  relation: core.players
  checks:
    min_rows: 800
    max_null_ratio: {full_name: 0.0, date_of_birth: 0.02, nationality: 0.0}

- sport: F1
  kind: live
  source_id: f1db
  relation: core.matches
  date_column: race_date
  checks:
    # a race weekend every 1-3 weeks in season; f1db releases after each race
    max_staleness_days: 35
